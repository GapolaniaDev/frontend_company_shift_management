<!-- Botón para abrir/cerrar el menú en móviles -->
<button (click)="toggleMenu()"
        class="fixed top-2 text-3xl left-4 z-50 p-2 bg-transparent text-gray-900 dark:text-white rounded shadow-md border-gray-300 dark:border-gray-700">
  ☰
</button>

<!-- Fondo oscuro cuando el menú está abierto -->
<div class="fixed inset-0 bg-black/50 transition-opacity z-40"
     [hidden]="!menuOpen" (click)="toggleMenu()"
></div>

<div
  class="fixed top-0 left-0 h-full w-64 bg-white/10 backdrop-blur-md shadow-md transform transition-transform duration-300 ease-in-out z-50"
  [class.-translate-x-full]="!menuOpen">

  <!-- Botón "X" para cerrar el menú -->
  <button (click)="toggleMenu()"
          class="absolute top-4 right-4 text-gray-600 dark:text-gray-300 text-2xl">
    ✕
  </button>
  <nav class="mt-10 space-y-4 text-gray-800 dark:text-gray-300">
    <a routerLink="/home"
       routerLinkActive="text-blue-500 font-bold"
       class="block px-6 py-2 hover:bg-gray-200 dark:hover:bg-gray-700">
      Home
    </a>

    <a routerLink="/schedule"
       routerLinkActive="text-blue-500 font-bold"
       class="block px-6 py-2 hover:bg-gray-200 dark:hover:bg-gray-700">
      Schedule
    </a>

    <a routerLink="/shift-history"
       routerLinkActive="text-blue-500 font-bold"
       class="block px-6 py-2 hover:bg-gray-200 dark:hover:bg-gray-700">
      Shift History
    </a>


    <div class="px-6 py-2 font-semibold">Configurations</div>

    <a routerLink="/employees"
       routerLinkActive="text-blue-500 font-bold"
       class="block px-8 py-2 hover:bg-gray-200 dark:hover:bg-gray-700">
      Employees
    </a>

    <a routerLink="/shift-types"
       routerLinkActive="text-blue-500 font-bold"
       class="block px-8 py-2 hover:bg-gray-200 dark:hover:bg-gray-700">
      Shift Types
    </a>

    <a routerLink="/shift-settings"
       routerLinkActive="text-blue-500 font-bold"
       class="block px-8 py-2 hover:bg-gray-200 dark:hover:bg-gray-700">
      Shift Settings
    </a>

    <a routerLink="/payment-periods"
       routerLinkActive="text-blue-500 font-bold"
       class="block px-8 py-2 hover:bg-gray-200 dark:hover:bg-gray-700">
      Payment Periods
    </a>

    <a routerLink="/profile"
       routerLinkActive="text-blue-500 font-bold"
       class="block px-6 py-2 hover:bg-gray-200 dark:hover:bg-gray-700">
      Profile
    </a>
  </nav>
</div>
