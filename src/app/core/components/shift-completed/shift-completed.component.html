<div class="min-h-screen bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-200 flex items-center justify-center">
  <div class="text-center p-8 bg-white dark:bg-gray-700 rounded-lg shadow-lg max-w-lg">
    <!-- Success Icon -->
    <div class="mb-6">
      <svg class="mx-auto h-20 w-20 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </div>

    <!-- Completion Message -->
    <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100 mb-4">
      Clock off completed!
    </h1>
    <p class="text-gray-600 dark:text-gray-300 mb-6 text-lg">
      Thank you for your work today. We hope to see you again!
    </p>

    <!-- Divider -->
    <div class="w-2/3 mx-auto border-b-2 border-gray-200 dark:border-gray-600 my-6"></div>

    <!-- Shift Summary Section -->
    <div class="mt-6 bg-gray-100 dark:bg-gray-800 p-6 rounded-lg">
      <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-200 mb-4">Shift Summary</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
        <div>
          <p class="mb-2">
            <span class="font-medium text-gray-500 dark:text-gray-400">Start:</span>
            <span class="text-gray-800 dark:text-gray-200">{{ formattedStartDateTime }}</span>
          </p>
          <p class="mb-2">
            <span class="font-medium text-gray-500 dark:text-gray-400">End:</span>
            <span class="text-gray-800 dark:text-gray-200">{{ formattedEndDateTime }}</span>
          </p>
        </div>
        <div>
          <p class="mb-2">
            <span class="font-medium text-gray-500 dark:text-gray-400">Total Hours:</span>
            <span class="text-gray-800 dark:text-gray-200 font-semibold">{{ totalHours }} hours</span>
          </p>
        </div>
      </div>
    </div>

    <!-- Additional Message -->
    <p class="mt-6 text-sm text-gray-500 dark:text-gray-400 italic">
      "Great job! Your shift has been successfully recorded." 👍
    </p>
  </div>
</div>
