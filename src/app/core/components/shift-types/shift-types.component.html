<div class="min-h-screen bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-200 p-6">
  <div class="max-w-6xl mx-auto bg-white dark:bg-gray-700 rounded-lg shadow-md p-8">
    <!-- Page Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Shift Types</h1>
      <p class="text-sm text-gray-600 dark:text-gray-400">Define and manage different types of shifts.</p>
    </div>

    <!-- Form to Add/Edit Shift Type -->
    <div class="bg-gray-100 dark:bg-gray-600 p-6 rounded-lg shadow mb-8">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-4">Add / Edit Shift Type</h2>
      <form id="shiftTypeForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Shift Type Name -->
        <div>
          <label for="type-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Shift Type Name</label>
          <input
            type="text"
            id="type-name"
            placeholder="e.g., Regular Shift"
            class="mt-1 block w-full px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-200 border border-gray-300 dark:border-gray-500 rounded-lg"
          />
        </div>
        <!-- Shift Category -->
        <div>
          <label for="type-category" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Shift Category</label>
          <select
            id="type-category"
            class="mt-1 block w-full px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-200 border border-gray-300 dark:border-gray-500 rounded-lg"
          >
            <option value="" disabled selected>Select category</option>
            <option value="Regular">Regular</option>
            <option value="Overtime">Overtime</option>
            <option value="Night">Night</option>
          </select>
        </div>
        <!-- Shift Bonus (Optional) -->
        <div>
          <label for="bonus" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Bonus Amount (Optional)</label>
          <input
            type="number"
            id="bonus"
            placeholder="e.g., 50"
            class="mt-1 block w-full px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-200 border border-gray-300 dark:border-gray-500 rounded-lg"
          />
        </div>
        <!-- Description -->
        <div>
          <label for="type-description" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Description</label>
          <textarea
            id="type-description"
            rows="3"
            placeholder="e.g., This shift type is for regular work shifts during the day."
            class="mt-1 block w-full px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-200 border border-gray-300 dark:border-gray-500 rounded-lg"
          ></textarea>
        </div>
      </form>
      <div class="mt-4">
        <button
          type="button"
          class="px-6 py-2 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-500">
          Save Shift Type
        </button>
      </div>
    </div>

    <!-- List of Shift Types -->
    <div>
      <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-4">Existing Shift Types</h2>
      <div class="overflow-x-auto">
        <table class="w-full bg-white dark:bg-gray-700 rounded-lg shadow">
          <thead class="bg-gray-100 dark:bg-gray-600">
          <tr>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">#</th>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">Shift Type</th>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">Category</th>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">Bonus Amount</th>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">Description</th>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">Actions</th>
          </tr>
          </thead>
          <tbody>
          <!-- Example Rows -->
          <tr class="border-b dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600">
            <td class="px-4 py-2 text-gray-900 dark:text-gray-300">1</td>
            <td class="px-4 py-2 text-gray-900 dark:text-gray-300">Regular Shift</td>
            <td class="px-4 py-2 text-gray-900 dark:text-gray-300">Regular</td>
            <td class="px-4 py-2 text-gray-900 dark:text-gray-300">$0</td>
            <td class="px-4 py-2 text-gray-900 dark:text-gray-300">This shift type is for regular working hours during the day.</td>
            <td class="px-4 py-2">
              <button class="text-blue-500 hover:underline dark:text-blue-400 dark:hover:text-blue-300">Edit</button>
              <button class="ml-4 text-red-500 hover:underline dark:text-red-400 dark:hover:text-red-300">Delete</button>
            </td>
          </tr>
          <!-- Add more rows dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
