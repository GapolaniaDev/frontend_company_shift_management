<google-map
  class="w-full h-full"
  height="100%"
  width="100%"
  [center]="center"
  [zoom]="zoom"
  [options]="options">
  <map-marker [position]="center" [options]="markerOptions"></map-marker>
  <map-circle [center]="center" [radius]="radius" [options]="circleOptions"></map-circle>
</google-map>
