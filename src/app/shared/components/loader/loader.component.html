<div *ngIf="isLoading | async"
     class="fixed inset-0 bg-white dark:bg-gray-900 flex items-center justify-center z-50">
  <div class="flex flex-col items-center">
    <div class="loader border-t-4 border-blue-500 rounded-full w-16 h-16 animate-spin"></div>
    <p class="mt-4 text-lg font-medium text-gray-800 dark:text-gray-200">Loading...</p>
  </div>
</div>
