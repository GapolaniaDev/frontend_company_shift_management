<div
  *ngIf="isShiftActive && isClockReady"
  class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center bg-black/70 p-6 rounded-lg z-[5]">
  <div class="mb-6">
    <ng-icon [name]="'heroClockSolid'" class="text-white text-4xl w-32 h-32 animate-pulse"></ng-icon>
  </div>
  <div class="text-6xl font-bold text-white tracking-wider mb-4">
    {{ clockData.hours }}:{{ clockData.minutes }}:{{ clockData.seconds }}
  </div>
  <div class="flex space-x-4 justify-center text-white/80 text-sm">
    <div class="flex items-center">
      <ng-icon *ngIf="clockData.period === 'AM'" [name]="'heroSunSolid'" class="text-white w-8 h-8 mr-4"></ng-icon>
      <ng-icon *ngIf="clockData.period === 'PM'" [name]="'heroMoonSolid'" class="text-white w-8 h-8 mr-4"></ng-icon>
      <span id="period">{{ clockData.period }}</span>
    </div>
    <div class="flex items-center">
      <ng-icon [name]="'heroCalendarDaysSolid'" class="text-white w-8 h-8 mr-1"></ng-icon>
      <span id="date">{{ clockData.currentDate }}</span>
    </div>
  </div>
</div>


<div *ngIf="isShiftActive && !isClockReady" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center bg-black/70 p-6 rounded-lg z-[9999]">
  <div>Loading clock...</div>
</div>
