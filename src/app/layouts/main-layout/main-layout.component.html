<app-loader></app-loader>

<header class="fixed top-0 w-full bg-white dark:bg-gray-900 shadow-md z-50">

  <nav class="container mx-auto px-3 py-1.5 flex items-center justify-between gap-2">
    <!-- Menú lateral -->
    <app-menu (menuOpenChange)="onMenuOpenChange($event)"></app-menu>


    <div class="text-lg font-semibold text-gray-800 dark:text-white">Shift Management</div>

    <div class="hidden lg:flex items-center gap-2">
      <button *ngIf="!isLoggedIn" routerLink="/login"
            class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-1 px-3 rounded-md text-xs">
        Login
      </button>
      <button *ngIf="isLoggedIn" (click)="logout()"
              class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-1 px-3 rounded-md text-xs">
        Logout
      </button>

      <!-- Botón de modo oscuro -->
      <button (click)="toggleDarkMode()" class="p-1.5 rounded-md text-gray-800 dark:text-gray-200 bg-transparent">
        <span *ngIf="!isDarkMode">🌙</span> <!-- Mostrar luna si está en modo claro -->
        <span *ngIf="isDarkMode">☀️</span> <!-- Mostrar sol si está en modo oscuro -->
      </button>
    </div>
  </nav>
</header>

<main
  class="w-full transition-all duration-300 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-200"
  [class.lg:pl-64]="menuOpen">
  <router-outlet></router-outlet>
</main>
