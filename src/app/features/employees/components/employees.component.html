<div class="p-6 bg-gray-50 dark:bg-gray-800">
  <!-- Component Title -->
  <h2 class="text-2xl font-bold mb-4 text-gray-800 dark:text-gray-100">Employee Management</h2>

  <!-- Form for adding/editing employees -->
  <form class="mb-6 p-4 bg-white dark:bg-gray-700 rounded shadow">
    <h3 class="text-lg font-semibold mb-2 text-gray-700 dark:text-gray-200">Add/Edit Employee</h3>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-600 dark:text-gray-300">Name</label>
        <input type="text" id="name" placeholder="Employee Name"
               class="mt-1 block w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded dark:bg-gray-600 dark:border-gray-500 dark:text-gray-200">
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-600 dark:text-gray-300">Email</label>
        <input type="email" id="email" placeholder="Employee Email"
               class="mt-1 block w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded dark:bg-gray-600 dark:border-gray-500 dark:text-gray-200">
      </div>
    </div>
    <div class="mt-4">
      <label for="role" class="block text-sm font-medium text-gray-600 dark:text-gray-300">Role</label>
      <select id="role"
              class="mt-1 block w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded dark:bg-gray-600 dark:border-gray-500 dark:text-gray-200">
        <option value="admin">Administrator</option>
        <option value="staff">Staff</option>
        <option value="intern">Intern</option>
      </select>
    </div>
    <button type="button"
            class="mt-4 bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 dark:hover:bg-blue-400">Save</button>
  </form>

  <!-- Employee List Table -->
  <div class="overflow-x-auto">
    <table class="table-auto w-full bg-white dark:bg-gray-700 rounded shadow">
      <thead class="bg-gray-100 dark:bg-gray-600">
      <tr>
        <th class="px-4 py-2 text-left font-medium text-gray-600 dark:text-gray-300">#</th>
        <th class="px-4 py-2 text-left font-medium text-gray-600 dark:text-gray-300">Name</th>
        <th class="px-4 py-2 text-left font-medium text-gray-600 dark:text-gray-300">Email</th>
        <th class="px-4 py-2 text-left font-medium text-gray-600 dark:text-gray-300">Role</th>
        <th class="px-4 py-2 text-left font-medium text-gray-600 dark:text-gray-300">Actions</th>
      </tr>
      </thead>
      <tbody>
      <!-- Example Row -->
      <tr class="border-b dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600">
        <td class="px-4 py-2 text-gray-700 dark:text-gray-300">1</td>
        <td class="px-4 py-2 text-gray-700 dark:text-gray-300">John Doe</td>
        <td class="px-4 py-2 text-gray-700 dark:text-gray-300">john.doe&#64;example.com</td>
        <td class="px-4 py-2 text-gray-700 dark:text-gray-300">Administrator</td>
        <td class="px-4 py-2">
          <button
            class="text-blue-500 hover:underline dark:text-blue-400 dark:hover:text-blue-300">Edit</button>
          <button
            class="ml-4 text-red-500 hover:underline dark:text-red-400 dark:hover:text-red-300">Delete</button>
        </td>
      </tr>
      <!-- More employees can be added dynamically -->
      </tbody>
    </table>
  </div>
</div>
