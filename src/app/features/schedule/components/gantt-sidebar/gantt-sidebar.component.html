<!-- Sidebar with employee list -->
<div class="sticky left-0 z-30 w-[250px] min-w-[250px] max-w-[250px] bg-white dark:bg-gray-800">
  <div
    *ngFor="let employee of employees"
    (click)="onEmployeeClick(employee)"
    class="px-3 py-3 flex items-center gap-2 border-r-2 border-indigo-600 dark:border-indigo-600 border-b border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer min-h-[52px]">
    <img 
      [src]="employee.avatar" 
      [alt]="employee.name"
      class="h-6 w-6 rounded-full">
    <span class="text-sm font-medium">{{ employee.name }}</span>
  </div>
</div>
