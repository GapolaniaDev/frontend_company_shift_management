<!-- Header -->
<div class="sticky top-0 z-40 bg-gray-100 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
  <div
    class="grid [grid-auto-columns:0] text-xs font-semibold text-gray-600 dark:text-gray-300"
    [style.grid-template-columns]="getGridTemplateColumns()">

    <!-- Columna izquierda "Schedule" fija y con altura de 2 filas -->
    <div
      class="row-span-2 px-3 py-1 bg-gray-100 dark:bg-gray-800 sticky top-0 left-0 z-50 w-[250px] min-w-[250px] max-w-[250px] border-r-2 border-indigo-600 dark:border-indigo-600 flex items-center justify-center text-center">
      <span class="whitespace-nowrap">Schedule</span>
    </div>
    <!-- Day Header -->
    <app-gantt-day-header
      [days]="days">
    </app-gantt-day-header>
  </div>
</div>
