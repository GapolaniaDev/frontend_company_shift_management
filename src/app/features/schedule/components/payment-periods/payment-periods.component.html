<div class="min-h-screen bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-200 p-6">
  <div class="max-w-6xl mx-auto bg-white dark:bg-gray-700 rounded-lg shadow-md p-8">
    <!-- Page Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Payment Periods</h1>
      <p class="text-sm text-gray-600 dark:text-gray-400">Manage the list of payment periods.</p>
    </div>

    <!-- Form to Add/Edit Payment Period -->
    <div class="bg-gray-100 dark:bg-gray-600 p-6 rounded-lg shadow mb-8">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-4">Add / Edit Payment Period</h2>
      <form id="paymentPeriodForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Payment Period Name -->
        <div>
          <label for="period-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Payment Period Name</label>
          <input
            type="text"
            id="period-name"
            placeholder="e.g., January 2024"
            class="mt-1 block w-full px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-200 border border-gray-300 dark:border-gray-500 rounded-lg"
          />
        </div>
        <!-- Start Date -->
        <div>
          <label for="start-date" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Start Date</label>
          <input
            type="date"
            id="start-date"
            class="mt-1 block w-full px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-200 border border-gray-300 dark:border-gray-500 rounded-lg"
          />
        </div>
        <!-- End Date -->
        <div>
          <label for="end-date" class="block text-sm font-medium text-gray-700 dark:text-gray-300">End Date</label>
          <input
            type="date"
            id="end-date"
            class="mt-1 block w-full px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-200 border border-gray-300 dark:border-gray-500 rounded-lg"
          />
        </div>
        <!-- Payment Amount -->
        <div>
          <label for="amount" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Payment Amount</label>
          <input
            type="number"
            id="amount"
            placeholder="e.g., 1000"
            class="mt-1 block w-full px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-200 border border-gray-300 dark:border-gray-500 rounded-lg"
          />
        </div>
      </form>
      <div class="mt-4">
        <button
          type="button"
          class="px-6 py-2 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-500">
          Save Payment Period
        </button>
      </div>
    </div>

    <!-- List of Payment Periods -->
    <div>
      <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-4">Existing Payment Periods</h2>
      <div class="overflow-x-auto">
        <table class="w-full bg-white dark:bg-gray-700 rounded-lg shadow">
          <thead class="bg-gray-100 dark:bg-gray-600">
          <tr>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">#</th>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">Name</th>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">Start Date</th>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">End Date</th>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">Payment Amount</th>
            <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-300">Actions</th>
          </tr>
          </thead>
          <tbody>
          <!-- Example Rows -->
          <tr class="border-b dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600">
            <td class="px-4 py-2 text-gray-900 dark:text-gray-300">1</td>
            <td class="px-4 py-2 text-gray-900 dark:text-gray-300">January 2024</td>
            <td class="px-4 py-2 text-gray-900 dark:text-gray-300">2024-01-01</td>
            <td class="px-4 py-2 text-gray-900 dark:text-gray-300">2024-01-31</td>
            <td class="px-4 py-2 text-gray-900 dark:text-gray-300">$1000</td>
            <td class="px-4 py-2">
              <button class="text-blue-500 hover:underline dark:text-blue-400 dark:hover:text-blue-300">Edit</button>
              <button class="ml-4 text-red-500 hover:underline dark:text-red-400 dark:hover:text-red-300">Delete</button>
            </td>
          </tr>
          <!-- Add more rows dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
