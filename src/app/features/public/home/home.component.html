<!-- Main shift view when there's an active shift with state NOT_STARTED or STARTED -->
<div *ngIf="isThereShift && shiftState !== ShiftState.FINISHED" class="relative h-screen">
  <app-maps class="absolute inset-0 w-full h-full"></app-maps>
  <app-clock></app-clock>
  <app-confirmation-modal></app-confirmation-modal>
  <button (click)="refreshShifts()"
          aria-label="Reload"
          title="Reload Page"
          class="absolute top-20 right-4 bg-white p-3 rounded-md z-10 text-lg shadow-md">
    <ng-icon [name]="'heroArrowPathSolid'" class="text-gray-800 w-8 h-8"></ng-icon>
  </button>
  <app-shift-details></app-shift-details>
</div>

<!-- Shift completed view - shown when shift state is FINISHED -->
<app-shift-completed
  *ngIf="isThereShift && shiftState === ShiftState.FINISHED"
  [completedShift]="getCurrentShift()"
  (close)="closeCompletedView()">
</app-shift-completed>

<!-- No shift view - shown when there's no active shift -->
<app-no-shift-details *ngIf="!isThereShift"></app-no-shift-details>
